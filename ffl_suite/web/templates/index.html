<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFL Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Touch Friendly Tweaks */
        body { -webkit-user-select: none; }
        .tap-target { min-height: 48px; min-width: 48px; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans h-screen flex overflow-hidden" x-data="app()">

    <!-- Sidebar / Drawer -->
    <aside class="w-20 lg:w-64 bg-gray-800 border-r border-gray-700 flex flex-col justify-between">
        <div class="p-4 flex items-center justify-center lg:justify-start">
            <span class="text-3xl">⚡</span>
            <span class="hidden lg:block ml-3 text-xl font-bold">FFL Suite</span>
        </div>

        <nav class="flex-1 px-2 py-4 space-y-2">
            <template x-for="item in navItems">
                <a href="#" @click="currentView = item.id"
                   :class="{'bg-blue-600 text-white': currentView === item.id, 'text-gray-400 hover:bg-gray-700': currentView !== item.id}"
                   class="flex items-center px-4 py-3 rounded-xl transition-colors duration-200 group tap-target">
                    <span class="text-2xl" x-text="item.icon"></span>
                    <span class="hidden lg:block ml-3 font-medium" x-text="item.label"></span>
                </a>
            </template>
        </nav>

        <div class="p-4">
            <button class="w-full bg-gray-700 hover:bg-gray-600 p-3 rounded-xl flex items-center justify-center tap-target">
                ⚙️ <span class="hidden lg:block ml-2">Settings</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative overflow-y-auto">
        <!-- Header -->
        <header class="h-16 bg-gray-800 border-b border-gray-700 flex items-center px-6 justify-between shrink-0">
            <h1 class="text-2xl font-bold" x-text="viewTitle"></h1>
            <div class="flex items-center space-x-4">
                <span class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-sm font-medium">Online</span>
                <div class="h-10 w-10 bg-gray-600 rounded-full"></div>
            </div>
        </header>

        <!-- Dashboard View -->
        <div x-show="currentView === 'dashboard'" class="p-6 animate-fade-in flex flex-col h-full overflow-y-auto">
            <!-- Top Row: Stats -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
                <div class="bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-700">
                    <div class="text-gray-400 mb-2">Total Inventory</div>
                    <div class="text-4xl font-bold text-blue-400" x-text="stats.inventory">...</div>
                </div>
                <div class="bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-700">
                    <div class="text-gray-400 mb-2">Acquisitions</div>
                    <div class="text-4xl font-bold text-green-400" x-text="stats.acquisitions">...</div>
                </div>
                <div class="bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-700">
                    <div class="text-gray-400 mb-2">Dispositions</div>
                    <div class="text-4xl font-bold text-purple-400" x-text="stats.dispositions">...</div>
                </div>

                <!-- Quick Action -->
                <button @click="currentView = 'acquire'" class="bg-blue-600 hover:bg-blue-500 rounded-2xl p-6 flex flex-col items-center justify-center shadow-lg transform transition active:scale-95 tap-target">
                    <span class="text-4xl mb-2">➕</span>
                    <span class="font-bold text-lg">Quick Acquire</span>
                </button>
            </div>

            <!-- Middle Row: Charts -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                <div class="bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-700 h-80">
                    <h3 class="text-lg font-bold text-white mb-4">Sales Trend (Last 7 Days)</h3>
                    <div class="relative h-60 w-full">
                        <canvas id="chartSales"></canvas>
                    </div>
                </div>
                <div class="bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-700 h-80">
                    <h3 class="text-lg font-bold text-white mb-4">Inventory Mix</h3>
                    <div class="relative h-60 w-full">
                        <canvas id="chartInventory"></canvas>
                    </div>
                </div>
            </div>

            <!-- Bottom Row: Activity Feed -->
            <div class="bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-700">
                <h3 class="text-lg font-bold text-white mb-4">Recent Activity</h3>
                <div class="space-y-4">
                    <template x-for="act in stats.activity" :key="act.date + act.description">
                        <div class="flex items-center justify-between border-b border-gray-700 pb-2">
                            <div class="flex items-center">
                                <span class="text-2xl mr-3" x-text="act.type === 'Acquisition' ? '📥' : '📤'"></span>
                                <div>
                                    <div class="text-white font-medium" x-text="act.description"></div>
                                    <div class="text-gray-500 text-sm" x-text="act.type"></div>
                                </div>
                            </div>
                            <div class="text-gray-400 text-sm" x-text="act.date"></div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Dynamic Module Container -->
        <div x-show="currentView !== 'dashboard'" class="flex-1 overflow-y-auto" id="module-container">
            <!-- Content loaded via HTMX/Fetch or simple x-html if we trust local -->
            <!-- For this MVP, we will use a simple Alpine fetch on view change -->
        </div>

    </main>

    <script>
        function app() {
            return {
                currentView: 'dashboard',
                stats: { inventory: '-', acquisitions: '-', dispositions: '-' },
                navItems: [
                    { id: 'dashboard', icon: '🏠', label: 'Dashboard' },
                    { id: 'inventory', icon: '📦', label: 'Inventory', url: '/modules/inventory' },
                    { id: 'acquire', icon: '➕', label: 'Acquire', url: '/modules/acquisition' },
                    { id: 'dispose', icon: '➖', label: 'Dispose', url: '/modules/disposition' },
                    { id: '4473', icon: '📝', label: 'Forms 4473', url: '/modules/forms_4473' },
                    { id: 'nfa', icon: '🔐', label: 'NFA Vault', url: '/modules/nfa_vault' },
                    { id: 'gunsmith', icon: '🔨', label: 'Gunsmithing', url: '/modules/gunsmithing' },
                    { id: 'pos', icon: '🛒', label: 'Point of Sale', url: '/modules/pos' },
                    { id: 'settings', icon: '⚙️', label: 'Settings', url: '/modules/settings' },
                ],
                get viewTitle() {
                    return this.navItems.find(i => i.id === this.currentView)?.label || 'App';
                },
                init() {
                    fetch('/api/dashboard/stats')
                        .then(r => r.json())
                        .then(data => {
                            this.stats = data;
                            this.initCharts(data.charts);
                        });

                    this.$watch('currentView', (value) => {
                        if(value === 'dashboard') return;
                        // Load module content
                        const item = this.navItems.find(i => i.id === value);
                        if(item && item.url) {
                            fetch(item.url)
                                .then(r => r.text())
                                .then(html => {
                                    document.getElementById('module-container').innerHTML = html;
                                    // Re-initialize Alpine components in new HTML?
                                    // Alpine doesn't auto-scan injected HTML by default like this in vanilla.
                                    // Hack: Simple x-data refresh or use a router.
                                    // Correct way: use x-html if safe, but scripts inside won't run easily.
                                    // Better: We reload page or use iframe? No.
                                    // Real solution for "Single Page App" with Alpine:
                                    // The script tags in templates/modules/*.html won't execute via innerHTML.
                                    // We must extract and run them.
                                    this.executeScripts(document.getElementById('module-container'));
                                });
                        }
                    });
                },
                executeScripts(element) {
                    const scripts = element.getElementsByTagName("script");
                    for(let i=0; i<scripts.length; i++) {
                        const newScript = document.createElement("script");
                        newScript.text = scripts[i].text;
                        document.body.appendChild(newScript);
                        // cleanup
                        document.body.removeChild(newScript);
                    }
                },
                initCharts(data) {
                    if(!document.getElementById('chartSales')) return;

                    new Chart(document.getElementById('chartSales'), {
                        type: 'bar',
                        data: {
                            labels: data.sales.labels,
                            datasets: [{
                                label: 'Sales ($)',
                                data: data.sales.data,
                                backgroundColor: '#3b82f6',
                                borderRadius: 5
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: { grid: { color: '#374151' }, ticks: { color: '#9ca3af' } },
                                x: { grid: { display: false }, ticks: { color: '#9ca3af' } }
                            }
                        }
                    });

                    new Chart(document.getElementById('chartInventory'), {
                        type: 'doughnut',
                        data: {
                            labels: data.inventory.labels,
                            datasets: [{
                                data: data.inventory.data,
                                backgroundColor: ['#3b82f6', '#10b981', '#8b5cf6', '#f59e0b', '#ef4444'],
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: 'right', labels: { color: '#d1d5db' } } }
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
