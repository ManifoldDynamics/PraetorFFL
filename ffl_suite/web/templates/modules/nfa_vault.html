<div x-data="nfa()" class="p-6 h-full flex flex-col">
    <!-- Tabs -->
    <div class="flex space-x-4 mb-6 border-b border-gray-700 pb-2">
        <button @click="tab='inventory'" :class="tab==='inventory' ? 'text-blue-400 border-b-2 border-blue-400' : 'text-gray-400'" class="px-4 py-2 font-bold">NFA Inventory</button>
        <button @click="tab='entities'" :class="tab==='entities' ? 'text-blue-400 border-b-2 border-blue-400' : 'text-gray-400'" class="px-4 py-2 font-bold">Entities & Trusts</button>
        <button @click="tab='forms'" :class="tab==='forms' ? 'text-blue-400 border-b-2 border-blue-400' : 'text-gray-400'" class="px-4 py-2 font-bold">E-Forms Helper</button>
    </div>

    <!-- Inventory Tab -->
    <div x-show="tab==='inventory'" class="flex-1 overflow-y-auto">
        <div class="flex justify-end mb-4">
            <button @click="showAcquireModal=true" class="bg-blue-600 px-4 py-2 rounded-lg text-white font-bold">Acquire NFA Item</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <template x-for="item in inventory" :key="item.id">
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                    <div class="flex justify-between">
                        <span class="bg-red-500/20 text-red-400 px-2 py-1 rounded text-xs font-bold" x-text="item.type"></span>
                        <span class="font-mono text-gray-500" x-text="item.serial"></span>
                    </div>
                    <div class="mt-2 text-lg font-bold text-white" x-text="item.make + ' ' + item.model"></div>
                    <div class="mt-4 flex space-x-2">
                        <button class="flex-1 bg-gray-700 py-2 rounded-lg text-sm hover:bg-gray-600">Transfer Out (Form 4)</button>
                        <button class="flex-1 bg-gray-700 py-2 rounded-lg text-sm hover:bg-gray-600">Form 3</button>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Forms Tab -->
    <div x-show="tab==='forms'" class="flex-1 overflow-y-auto">
        <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700 max-w-3xl mx-auto">
            <h3 class="text-xl font-bold text-white mb-6">Generate Form 4 Helper</h3>

            <div class="grid grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-gray-400 mb-2">Transferee (Entity/Trust)</label>
                    <select x-model="form4.transferee_entity_id" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white">
                        <option value="">Select Entity...</option>
                        <template x-for="e in entities" :key="e.id"><option :value="e.id" x-text="e.name"></option></template>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-400 mb-2">Firearm (Inventory)</label>
                    <select x-model="form4.firearm_id" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white">
                        <option value="">Select NFA Item...</option>
                        <template x-for="i in inventory" :key="i.id"><option :value="i.id" x-text="i.make + ' ' + i.model + ' (' + i.serial + ')'"></option></template>
                    </select>
                </div>
            </div>

            <h4 class="text-lg font-bold text-gray-400 mb-4 border-b border-gray-700 pb-2">CLEO Information</h4>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <input x-model="form4.cleo_name" placeholder="Name" class="bg-gray-900 border border-gray-600 rounded-xl px-4 py-2 text-white">
                <input x-model="form4.cleo_title" placeholder="Title (Sheriff)" class="bg-gray-900 border border-gray-600 rounded-xl px-4 py-2 text-white">
                <input x-model="form4.cleo_agency" placeholder="Agency" class="bg-gray-900 border border-gray-600 rounded-xl px-4 py-2 text-white">
                <input x-model="form4.cleo_address_street" placeholder="Address" class="bg-gray-900 border border-gray-600 rounded-xl px-4 py-2 text-white">
                <div class="flex space-x-2 col-span-2">
                    <input x-model="form4.cleo_address_city" placeholder="City" class="flex-1 bg-gray-900 border border-gray-600 rounded-xl px-4 py-2 text-white">
                    <input x-model="form4.cleo_address_state" placeholder="State" class="w-24 bg-gray-900 border border-gray-600 rounded-xl px-4 py-2 text-white">
                    <input x-model="form4.cleo_address_zip" placeholder="Zip" class="w-32 bg-gray-900 border border-gray-600 rounded-xl px-4 py-2 text-white">
                </div>
            </div>

            <button @click="generateForm" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl">Generate Helper PDF</button>
        </div>
    </div>

    <!-- Entities Tab -->
    <div x-show="tab==='entities'" class="flex-1 overflow-y-auto">
        <div class="flex justify-end mb-4">
            <button @click="showEntityModal=true" class="bg-blue-600 px-4 py-2 rounded-lg text-white font-bold">New Entity</button>
        </div>
        <div class="bg-gray-800 rounded-2xl overflow-hidden border border-gray-700">
            <table class="w-full text-left">
                <thead class="bg-gray-900 text-gray-400">
                    <tr>
                        <th class="p-4">Name</th>
                        <th class="p-4">Type</th>
                        <th class="p-4">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-700">
                    <template x-for="e in entities" :key="e.id">
                        <tr>
                            <td class="p-4 text-white font-bold" x-text="e.name"></td>
                            <td class="p-4 text-gray-400" x-text="e.type"></td>
                            <td class="p-4">
                                <button class="text-blue-400 hover:underline">Edit</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal: New Entity -->
    <div x-show="showEntityModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-8 rounded-2xl w-full max-w-md border border-gray-700">
            <h3 class="text-xl font-bold text-white mb-4">Create NFA Entity</h3>
            <input x-model="newEntity.name" placeholder="Entity Name (e.g. John Doe Trust)" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 mb-4 text-white">
            <select x-model="newEntity.entity_type" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 mb-4 text-white">
                <option>Trust</option><option>Corporation</option><option>Individual</option>
            </select>
            <!-- Address fields simplified for MVP -->
            <input x-model="newEntity.address_street" placeholder="Street Address" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 mb-4 text-white">
            <div class="flex justify-end space-x-4">
                <button @click="showEntityModal=false" class="text-gray-400">Cancel</button>
                <button @click="createEntity" class="bg-blue-600 px-6 py-2 rounded-xl text-white font-bold">Save</button>
            </div>
        </div>
    </div>

    <!-- Modal: Acquire NFA -->
    <div x-show="showAcquireModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-8 rounded-2xl w-full max-w-2xl border border-gray-700">
            <h3 class="text-xl font-bold text-white mb-6">Acquire NFA Item</h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-gray-400 text-sm">Transferor (Source)</label>
                    <select x-model="nfaAcq.contact_id" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-2 mt-1 text-white">
                        <option value="">Select Contact...</option>
                        <template x-for="c in contacts" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
                    </select>
                </div>
                <div>
                    <label class="text-gray-400 text-sm">Acquisition Date</label>
                    <input x-model="nfaAcq.acquisition_date" type="date" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-2 mt-1 text-white">
                </div>
                <div>
                    <label class="text-gray-400 text-sm">Serial</label>
                    <input x-model="nfaAcq.serial_number" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-2 mt-1 text-white">
                </div>
                <div>
                    <label class="text-gray-400 text-sm">Type</label>
                    <select x-model="nfaAcq.type" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-2 mt-1 text-white">
                        <option>Silencer</option><option>Short-Barreled Rifle</option><option>Short-Barreled Shotgun</option><option>Machine Gun</option><option>Any Other Weapon</option>
                    </select>
                </div>
                <div>
                    <label class="text-gray-400 text-sm">Make</label>
                    <input x-model="nfaAcq.make" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-2 mt-1 text-white">
                </div>
                <div>
                    <label class="text-gray-400 text-sm">Model</label>
                    <input x-model="nfaAcq.model" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-2 mt-1 text-white">
                </div>
                <div>
                    <label class="text-gray-400 text-sm">Caliber</label>
                    <input x-model="nfaAcq.caliber" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-2 mt-1 text-white">
                </div>
            </div>

            <div class="flex justify-end space-x-4 mt-6">
                <button @click="showAcquireModal=false" class="text-gray-400">Cancel</button>
                <button @click="acquireNfa" class="bg-blue-600 px-6 py-2 rounded-xl text-white font-bold">Acquire</button>
            </div>
        </div>
    </div>
</div>

<script>
    function nfa() {
        return {
            tab: 'inventory',
            inventory: [],
            entities: [],
            showEntityModal: false,
            showAcquireModal: false,
            newEntity: { name: '', entity_type: 'Trust', address_street: '', address_city: '', address_state: '', address_zip: '' },
            nfaAcq: { contact_id: '', acquisition_date: new Date().toISOString().split('T')[0], type: 'Silencer', make: '', model: '', serial_number: '', caliber: '', condition: 'New' },
            contacts: [],
            form4: { form_type: 'Form 4', transferee_entity_id: '', firearm_id: '', cleo_name: '', cleo_title: '', cleo_agency: '', cleo_address_street: '', cleo_address_city: '', cleo_address_state: '', cleo_address_zip: '' },

            init() {
                this.loadInv();
                this.loadEnts();
                fetch('/api/contacts').then(r=>r.json()).then(d=>this.contacts=d);
            },
            loadInv() { fetch('/api/nfa/inventory').then(r=>r.json()).then(d=>this.inventory=d); },
            loadEnts() { fetch('/api/nfa/entities').then(r=>r.json()).then(d=>this.entities=d); },

            createEntity() {
                fetch('/api/nfa/entities', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(this.newEntity)
                }).then(r=>r.json()).then(res => {
                    if(res.success) { this.showEntityModal=false; this.loadEnts(); }
                });
            },

            acquireNfa() {
                fetch('/api/nfa/acquire', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(this.nfaAcq)
                }).then(r=>r.json()).then(res => {
                    if(res.success) {
                        alert('Item Acquired into NFA Inventory');
                        this.showAcquireModal=false;
                        this.loadInv();
                    } else { alert('Error: ' + res.error); }
                });
            },

            generateForm() {
                fetch('/api/nfa/forms', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(this.form4)
                }).then(r=>r.json()).then(res => {
                    if(res.success && res.pdf_url) {
                        window.open(res.pdf_url, '_blank');
                    } else { alert('Error: ' + res.error); }
                });
            }
        }
    }
</script>
