<div x-data="pos()" class="flex h-full">
    <!-- Left: Cart -->
    <div class="w-1/3 bg-gray-800 border-r border-gray-700 flex flex-col">
        <div class="p-6 border-b border-gray-700">
            <h2 class="text-2xl font-bold text-white mb-2">Current Sale</h2>
            <div class="flex space-x-2">
                <select x-model="customer_id" class="flex-1 bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-white">
                    <option value="">Guest Customer</option>
                    <template x-for="c in contacts" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
                </select>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-2">
            <template x-for="(item, idx) in cart" :key="idx">
                <div class="bg-gray-700 p-3 rounded-lg flex justify-between items-center">
                    <div>
                        <div class="text-white font-bold" x-text="item.name"></div>
                        <div class="text-sm text-gray-400" x-text="'$' + item.price + ' x ' + item.quantity"></div>
                    </div>
                    <button @click="removeFromCart(idx)" class="text-red-400 hover:text-red-300">✕</button>
                </div>
            </template>
        </div>

        <div class="p-6 bg-gray-900 border-t border-gray-700">
            <div class="flex justify-between text-gray-400 mb-2"><span>Subtotal</span><span x-text="formatMoney(subtotal)"></span></div>
            <div class="flex justify-between text-gray-400 mb-4"><span>Tax (8.25%)</span><span x-text="formatMoney(tax)"></span></div>
            <div class="flex justify-between text-white text-2xl font-bold mb-6"><span>Total</span><span x-text="formatMoney(total)"></span></div>

            <button @click="checkout" :disabled="cart.length === 0" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl disabled:opacity-50 disabled:cursor-not-allowed">
                Complete Sale
            </button>
        </div>
    </div>

    <!-- Right: Products -->
    <div class="flex-1 p-6 flex flex-col">
        <div class="mb-6">
            <input x-model="search" @keyup.enter="searchProducts" type="text" placeholder="Scan Barcode or Search Product..." class="w-full bg-gray-800 border-none rounded-xl px-6 py-4 text-xl text-white focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Tabs -->
        <div class="flex space-x-4 mb-4">
            <button @click="activeTab='products'" :class="activeTab==='products' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-400'" class="px-4 py-2 rounded-lg">Products</button>
            <button @click="activeTab='firearms'" :class="activeTab==='firearms' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-400'" class="px-4 py-2 rounded-lg">Firearms</button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 overflow-y-auto">
            <template x-for="p in displayedItems" :key="p.id">
                <div @click="addToCart(p)" class="bg-gray-800 p-4 rounded-xl border border-gray-700 active:bg-gray-700 cursor-pointer flex flex-col justify-between h-32">
                    <div class="font-bold text-white truncate" x-text="p.name || (p.make + ' ' + p.model)"></div>
                    <div class="flex justify-between items-end">
                        <div class="text-sm text-gray-400" x-text="p.stock > 0 ? p.stock + ' in stock' : 'Out of Stock'"></div>
                        <div class="text-lg font-bold text-green-400" x-text="'$' + (p.price || 0)"></div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
    function pos() {
        return {
            cart: [],
            products: [],
            firearms: [],
            contacts: [],
            search: '',
            customer_id: '',
            activeTab: 'products',

            init() {
                this.loadProducts();
                this.loadFirearms();
                fetch('/api/contacts').then(r=>r.json()).then(d=>this.contacts=d);
            },
            loadProducts() { fetch('/api/products').then(r=>r.json()).then(d=>this.products=d); },
            loadFirearms() { fetch('/api/inventory').then(r=>r.json()).then(d=>this.firearms=d.map(f => ({...f, name: f.make+' '+f.model, type: 'firearm', price: 0}))); }, // Inventory API needs price update

            get displayedItems() {
                const list = this.activeTab === 'products' ? this.products : this.firearms;
                if(!this.search) return list;
                const q = this.search.toLowerCase();
                return list.filter(i => (i.name||'').toLowerCase().includes(q) || (i.upc||'').includes(q) || (i.serial||'').toLowerCase().includes(q));
            },

            addToCart(item) {
                // If firearm, only add 1 unique
                const existing = this.cart.find(c => c.id === item.id && c.type === item.type);
                if(existing) {
                    if(item.type !== 'firearm') existing.quantity++;
                } else {
                    this.cart.push({ ...item, quantity: 1, type: item.type || 'product' });
                }
            },
            removeFromCart(idx) { this.cart.splice(idx, 1); },

            get subtotal() { return this.cart.reduce((sum, i) => sum + (i.price * i.quantity), 0); },
            get tax() { return this.subtotal * 0.0825; },
            get total() { return this.subtotal + this.tax; },

            formatMoney(num) { return '$' + num.toFixed(2); },

            checkout() {
                const payload = {
                    customer_id: this.customer_id,
                    payment_method: 'Cash', // MVP hardcoded
                    items: this.cart
                };
                fetch('/api/checkout', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                }).then(r=>r.json()).then(res => {
                    if(res.success) {
                        alert("Sale Complete! Receipt #" + res.sale_id);
                        this.cart = [];
                        this.loadProducts(); // refresh stock
                    } else {
                        alert("Error: " + res.error);
                    }
                });
            }
        }
    }
</script>
