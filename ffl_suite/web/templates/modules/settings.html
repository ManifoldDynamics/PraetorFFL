<div x-data="settings()" class="p-6 max-w-4xl mx-auto">
    <h2 class="text-2xl font-bold text-white mb-6">Settings</h2>

    <!-- Tabs -->
    <div class="flex space-x-4 mb-6 border-b border-gray-700 pb-2">
        <button @click="tab='general'" :class="tab==='general' ? 'text-blue-400 border-b-2 border-blue-400' : 'text-gray-400'" class="px-4 py-2 font-bold">General Profile</button>
        <button @click="tab='pos'" :class="tab==='pos' ? 'text-blue-400 border-b-2 border-blue-400' : 'text-gray-400'" class="px-4 py-2 font-bold">POS & Hardware</button>
        <button @click="tab='system'" :class="tab==='system' ? 'text-blue-400 border-b-2 border-blue-400' : 'text-gray-400'" class="px-4 py-2 font-bold">System</button>
    </div>

    <!-- General Tab -->
    <div x-show="tab==='general'" class="bg-gray-800 rounded-2xl p-8 border border-gray-700">
        <div class="grid grid-cols-1 gap-6">
            <div>
                <label class="block text-gray-400 mb-2">FFL Name (Licensee)</label>
                <input x-model="config.ffl_name" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white">
            </div>
            <div>
                <label class="block text-gray-400 mb-2">License Number</label>
                <input x-model="config.ffl_license_number" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white">
            </div>
            <div>
                <label class="block text-gray-400 mb-2">Premise Address</label>
                <input x-model="config.ffl_premise_address" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white">
            </div>
            <div>
                <label class="block text-gray-400 mb-2">Logo URL / Path</label>
                <input x-model="config.logo_path" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white">
            </div>
        </div>
    </div>

    <!-- POS Tab -->
    <div x-show="tab==='pos'" class="flex gap-6 h-full">
        <!-- Left: Config -->
        <div class="flex-1 bg-gray-800 rounded-2xl p-8 border border-gray-700 overflow-y-auto">
            <h3 class="font-bold text-white mb-4 text-xl">Receipt Configuration</h3>

            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-gray-400 mb-2">Sales Tax Rate (0.0825 = 8.25%)</label>
                    <input x-model="config.tax_rate" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white">
                </div>

                <div>
                    <label class="block text-gray-400 mb-2">Header Message</label>
                    <textarea x-model="config.receipt_header" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white h-20"></textarea>
                </div>

                <div>
                    <label class="block text-gray-400 mb-2">Footer Message / Policy</label>
                    <textarea x-model="config.receipt_footer" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white h-24"></textarea>
                </div>

                <div class="space-y-2">
                    <label class="flex items-center space-x-3 cursor-pointer bg-gray-900 p-3 rounded-xl border border-gray-700">
                        <input type="checkbox" x-model="config.receipt_show_logo" class="form-checkbox h-5 w-5 text-blue-600 rounded">
                        <span class="text-white">Show Logo</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer bg-gray-900 p-3 rounded-xl border border-gray-700">
                        <input type="checkbox" x-model="config.receipt_show_tax" class="form-checkbox h-5 w-5 text-blue-600 rounded">
                        <span class="text-white">Show Tax Breakdown</span>
                    </label>
                </div>
            </div>

            <h3 class="font-bold text-white mb-4 text-xl border-t border-gray-700 pt-4">Hardware</h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-400 mb-2">Receipt Printer IP</label>
                    <input x-model="config.printer_ip" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white">
                </div>
                <div>
                    <label class="block text-gray-400 mb-2">Printer Type</label>
                    <select x-model="config.printer_type" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white">
                        <option value="80mm">Thermal 80mm</option>
                        <option value="58mm">Thermal 58mm</option>
                        <option value="A4">A4/Letter PDF</option>
                    </select>
                </div>
            </div>

            <!-- Scanner Test -->
            <div class="mt-6 p-4 bg-gray-900 rounded-xl border border-gray-700">
                <h3 class="font-bold text-gray-400 mb-2">Barcode Scanner Test</h3>
                <input type="text" placeholder="Click here and scan..." class="w-full bg-black border border-gray-600 rounded-lg px-3 py-2 font-mono text-green-400">
            </div>
        </div>

        <!-- Right: Live Preview -->
        <div class="w-1/3 bg-gray-900 rounded-2xl border border-gray-700 flex flex-col p-4">
            <h3 class="font-bold text-gray-400 mb-4 text-center">Live Preview (80mm)</h3>
            <div class="flex-1 bg-white rounded-lg overflow-hidden flex items-center justify-center relative">
                <iframe :src="previewUrl" class="w-full h-full border-none"></iframe>
                <div x-show="loadingPreview" class="absolute inset-0 bg-black/50 flex items-center justify-center text-white">Loading...</div>
            </div>
            <button @click="updatePreview" class="mt-4 bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-xl">Refresh Preview</button>
        </div>
    </div>

    <!-- System Tab -->
    <div x-show="tab==='system'" class="bg-gray-800 rounded-2xl p-8 border border-gray-700">
        <h3 class="font-bold text-white mb-4">Data Management</h3>
        <div class="space-y-4">
            <button class="w-full flex items-center justify-between p-4 bg-gray-900 rounded-xl hover:bg-gray-700">
                <span>📦 Backup Database</span>
                <span class="text-blue-400">Download .db</span>
            </button>
            <button class="w-full flex items-center justify-between p-4 bg-gray-900 rounded-xl hover:bg-gray-700">
                <span>📄 Export Contacts (CSV)</span>
                <span class="text-green-400">Download .csv</span>
            </button>
        </div>
    </div>

    <div class="mt-8 flex justify-end">
        <button @click="save" class="bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-8 rounded-xl text-lg shadow-lg">
            Save All Changes
        </button>
    </div>
</div>

<script>
    function settings() {
        return {
            tab: 'general',
            config: {},
            previewUrl: '',
            loadingPreview: false,

            init() {
                fetch('/api/settings').then(r=>r.json()).then(d => {
                    this.config = d;
                    // Ensure bools
                    this.config.receipt_show_logo = !!this.config.receipt_show_logo;
                    this.config.receipt_show_tax = !!this.config.receipt_show_tax;
                    if(this.tab==='pos') this.updatePreview();
                });

                this.$watch('tab', (val) => {
                    if(val === 'pos' && !this.previewUrl) this.updatePreview();
                });
            },

            save() {
                fetch('/api/settings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(this.config)
                }).then(r=>r.json()).then(res => {
                    if(res.success) {
                        alert("Settings Saved!");
                        if(this.tab==='pos') this.updatePreview();
                    }
                });
            },

            updatePreview() {
                this.loadingPreview = true;
                fetch('/api/settings/receipt-preview', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(this.config)
                })
                .then(r => r.json())
                .then(res => {
                    if(res.success) this.previewUrl = res.url;
                    this.loadingPreview = false;
                });
            }
        }
    }
</script>
