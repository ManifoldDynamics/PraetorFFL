<div x-data="gunsmithing()" class="p-6 h-full flex flex-col">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-white">Gunsmithing Jobs</h2>
        <button @click="showNewJob=true" class="bg-blue-600 px-4 py-2 rounded-lg text-white font-bold">New Job</button>
    </div>

    <!-- Kanban Board -->
    <div class="flex space-x-4 overflow-x-auto pb-4 flex-1">
        <template x-for="status in statuses" :key="status">
            <div class="w-80 flex-shrink-0 bg-gray-800 rounded-2xl p-4 border border-gray-700 flex flex-col">
                <h3 class="font-bold text-gray-400 mb-4" x-text="status"></h3>
                <div class="flex-1 space-y-3 overflow-y-auto">
                    <template x-for="job in jobs.filter(j => j.status === status)" :key="job.id">
                        <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 cursor-pointer hover:border-blue-500 transition" @click="editJob(job)">
                            <div class="flex justify-between items-start mb-2">
                                <span class="font-bold text-white" x-text="'#' + job.id"></span>
                                <span class="text-xs text-gray-500" x-text="job.date"></span>
                            </div>
                            <div class="text-blue-400 font-medium mb-1" x-text="job.customer"></div>
                            <div class="text-gray-300 text-sm mb-2" x-text="job.gun"></div>
                            <div class="text-gray-500 text-xs italic" x-text="job.description"></div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>

    <!-- New Job Modal -->
    <div x-show="showNewJob" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-8 rounded-2xl w-full max-w-lg border border-gray-700">
            <h3 class="text-xl font-bold text-white mb-4">Create New Job</h3>

            <label class="block text-gray-400 text-sm mb-1">Customer</label>
            <select x-model="newJob.customer_id" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 mb-4 text-white">
                <template x-for="c in contacts" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
            </select>

            <label class="block text-gray-400 text-sm mb-1">Firearm (Inventory ID)</label>
            <input x-model="newJob.firearm_id" placeholder="ID" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 mb-4 text-white">

            <label class="block text-gray-400 text-sm mb-1">Description</label>
            <textarea x-model="newJob.description" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 mb-4 text-white"></textarea>

            <div class="flex justify-end space-x-4">
                <button @click="showNewJob=false" class="text-gray-400">Cancel</button>
                <button @click="createJob" class="bg-blue-600 px-6 py-2 rounded-xl text-white font-bold">Create</button>
            </div>
        </div>
    </div>

    <!-- Edit Job Modal (Simplified) -->
    <div x-show="editingJob" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-8 rounded-2xl w-full max-w-lg border border-gray-700" x-data="{ status: '' }">
            <h3 class="text-xl font-bold text-white mb-4">Update Job</h3>
            <p class="text-gray-400 mb-4" x-text="editingJob?.description"></p>

            <label class="block text-gray-400 text-sm mb-1">Status</label>
            <select x-model="editingJob.status" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 mb-4 text-white">
                <template x-for="s in statuses" :key="s"><option :value="s" x-text="s"></option></template>
            </select>

            <div class="flex justify-between">
                <button @click="deleteJob" class="text-red-500">Delete</button>
                <div class="flex space-x-4">
                    <button @click="editingJob=null" class="text-gray-400">Cancel</button>
                    <button @click="updateJob" class="bg-green-600 px-6 py-2 rounded-xl text-white font-bold">Save</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function gunsmithing() {
        return {
            statuses: ['Intake', 'In Progress', 'Waiting Parts', 'Completed'],
            jobs: [],
            contacts: [],
            showNewJob: false,
            editingJob: null,
            newJob: { customer_id: '', firearm_id: '', description: '' },

            init() {
                this.loadJobs();
                fetch('/api/contacts').then(r=>r.json()).then(d=>this.contacts=d);
            },
            loadJobs() { fetch('/api/gunsmith/jobs').then(r=>r.json()).then(d=>this.jobs=d); },

            createJob() {
                fetch('/api/gunsmith/jobs', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(this.newJob)
                }).then(r=>r.json()).then(res => {
                    if(res.success) { this.showNewJob=false; this.loadJobs(); }
                });
            },
            editJob(job) { this.editingJob = { ...job }; }, // Clone
            updateJob() {
                fetch('/api/gunsmith/jobs', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(this.editingJob)
                }).then(r=>r.json()).then(res => {
                    if(res.success) { this.editingJob=null; this.loadJobs(); }
                });
            },
            deleteJob() {
                if(!confirm("Delete this job?")) return;
                fetch('/api/gunsmith/jobs?id=' + this.editingJob.id, { method: 'DELETE' })
                .then(r=>r.json()).then(res => {
                    if(res.success) { this.editingJob=null; this.loadJobs(); }
                });
            }
        }
    }
</script>
